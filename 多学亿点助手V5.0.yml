             - 所选草稿里含"目标评级"或"闯关" → 标记写【模式：J】。
             - 所选草稿里含"任务难度" → 标记写【模式：P】。
             - 形态确实判断不出来时，才按传入的 mode 映射：J_READY→J，P_READY→P，ASK→ASK。
          3. 不要改写、不要润色、不要新增或删除任何内容，只做选择与加标记。（这句话不要说出来）
          4. 标记行下面紧接草稿正文，不要额外添加任何标题或空行。
