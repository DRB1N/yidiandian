          2. 加标记前先做一次形态核对。草稿的实际形态和传入的 mode 对不上时，一律以草稿形态为准：
             - 所选草稿通篇只是一句或几句追问，既没有"目标评级"，也没有"闯关"，也没有"任务难度"
