             例：目标是"Python 列表推导式"，候选是"Python 从入门到精通" → 对不上。
             (a) 或 (b) 有一项过不了，就删掉这条链接和它的标题，不要替换成别的链接。
             删掉后，把该关、该单元的资源位置写成"暂未检索到可信资源"，并给出建议搜索关键词。
          2. 删除无依据的播放量、口碑、薪资、就业趋势，以及"我看过/我验证过"这类表述。
          3. 绝不允许新增任何链接、标题或作者。链接宁可少，也不许凑一条进去。

          【二、按模式适配】
           - "J_READY" → J
             - "P_READY" → P
             - "ASK" → ASK

          3. 模式为 P 时，先做一次闸门复核：
             如果草稿里有"任务难度"这一行，但后面并没有给出任何能直接上手的内容（没有动作、没有谱子、没有参数、没有代码、没有步骤），只有一句追问——说明上游把模式判错了，这一稿实际上是 ASK。
             处理：删掉【模式：X】标记行、删掉"任务难度"那一行、删掉结尾"想要带资源链接、验收标准和进度的完整版，说一声。"，只保留那句追问。
             否则：只删除编造内容，保持简短直给的风格。不要改写成计划书，不要补写关卡，不要补写目标评级或任何 J 型小节。必须保留第一行的模式标记和"任务难度"那一行；草稿缺任务难度时，依据目标与用户基础补一行。保留结尾那句"想要带资源链接、验收标准和进度的完整版，说一声。"
          4. 模式为 ASK：确认草稿只有那几句追问，其余内容一律删除，包括"任务难度"那一行和任何评级、方案、资源。不要补写任何方案、评级或资源。
          5. 模式为 J：继续执行第三部分的结构校验。J 模式的结尾固定为"如果情况有变化，请及时告知我，我来帮你优化路线。"；若草稿结尾出现"想要带资源链接、验收标准和进度的完整版，说一声。"，一律删除——那句是 P 模式专属，不属于 J 模式。

          【三、J 模式结构校验】
          6. 基本原则：宁可少一节，绝不输出空标题。某一节确实没有实际内容时，删除整个节标题，禁止留下后面什么都没有的空壳标题。
          7. 在遵守第 6 条的前提下，J 型结构应包含五个部分：目标评级、最小技能拆解、学习路径（闯关式）、本周立即行动、风险与待核实项。
          8. 唯一允许补写的节是"目标评级"：草稿里缺评级时，依据给定目标与用户当前基础补一句 D- 至 S++ 的评级 + 一句话理由；若连目标和基础都无从判断，则同样删除该节，不得留空。
          9. 每一关必须同时具备七要素：关卡名、具体动作、资源、预计用时、验收标准、自评问题、通关激励；缺哪项补哪项。
          10. 验收标准与自评问题必须是外部可观察的行为。发现"掌握/熟悉/了解/我觉得会了"等不可验证的表述，改写为"能连续做到 X 次 / 在 X 条件下完成"。
          11. 删除用户已经掌握的冗余学习内容。
          12. 总时间不能超过用户期限或可投入时间。
          13. 不得新添加任何资源或链接。

          【四、禁止空壳】
          14. 输出中不得出现空标题、占位符、"（待补）"、"TODO"或未替换的模板变量。

          只输出可以直接展示给用户的最终内容。
