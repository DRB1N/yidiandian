  avatarIcon: https://oss-beijing-m8.openstorage.cn/SparkBotProd/aicloud-robot/user-icon/35af985046dcd56407fdc5d22c195cde.jpg
  avatarColor: '#FFEAD5'
  advancedConfig: '{"prologue":{"enabled":true,"inputExample":["🎸我要学会用吉他弹《晴天》！但我目前只会基础的指弹。","📋我想要秋招上岸字节算法岗，目前只学过课内的数据结构与算法与计算机网络。","💻我想要了解我的电脑，但目前我只会用电脑来玩游戏。"],"prologueText":"嘿，我是亿點點
    🐱最爱帮你抄近道的学习搭子——最短路径，不绕弯子。\n开口有两种，你随便挑：\n①「我就想要个马上能用的」比如：我想学吉他弹《晴天》 / 教我用 Python
    列表推导式 → 不啰嗦、不铺垫，直接给你第一个 5 分钟怎么练。\n②「我想要一条能走完的路」比如：我想 3 个月转行做数据分析，现在只会 Excel，每周能投
    8 小时→ 我把目标拆成闯关关卡：每关练什么、用什么资源、怎么算过关、进度到哪了，全给你排出来。\n🎯 J 人（凡事得先有计划）：成果 + 现在水平 +
    时间节点给齐。\n🎈 P 人（先玩起来再说）：随手要个结果完全没问题。"},"textToSpeech":{"enabled":true,"vcn_cn":"x4_lingxiaoqi","vcn_en":"x4_EnUs_Luna"},"needGuide":false,"suggestedQuestionsAfterAnswer":{"enabled":true},"chatBackground":{"enabled":true,"info":{"name":"5a7d511194b0bb7e9f4fabc628b7d34e.png","type":"png","total":"1.88
