      nodeParam:
        uid: '19702983768'
        code: |-
          # -*- coding: utf-8 -*-


          def clean_content(text, max_length=2500):
              if not text:
                  return ""

              text = " ".join(str(text).split())

              if len(text) > max_length:
                  text = text[:max_length] + "……"

              return text


          def main(content_1, content_2, content_3):
              # 编号写死，不跟着过滤后的顺序走：某一路搜空时，【搜索器2】必须还是 query_2
              raw = [("1", content_1), ("2", content_2), ("3", content_3)]

              parts = []
              for tag, content in raw:
                  text = clean_content(content)
                  if text:
                      parts.append("【搜索器" + tag + "】" + "\n" + text)

              return "\n\n".join(parts)
        appId: 12a0a7e2
