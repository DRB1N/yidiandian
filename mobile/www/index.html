<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover 让 env(safe-area-inset-*) 在刘海屏下有值 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <title>亿點點</title>
    <!--
      server.errorPath 指向这一页：远程地址打不开时兜底显示。
      出现的场合就是"连不上服务器"，所以必须完全自包含 —— 不引任何 CDN。
    -->
    <style>
      :root {
        --paper: #f6f1e7;
        --paper-2: #efe8da;
        --card: #fffdf7;
        --ink: #1b1714;
        --ink-2: #4a433a;
        --ink-3: #857b6c;
        --rule: #ddd3bf;
        --rule-2: #cbbfa6;
        --vermilion: #c4432b;
        --highlighter: #f5db5c;
        --moss: #5e7a5c;
        --kai: 'LXGW WenKai', 'Kaiti SC', 'KaiTi', 'STKaiti', 'Songti SC', serif;
        --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top) + 26px) calc(env(safe-area-inset-right) + 18px)
          calc(env(safe-area-inset-bottom) + 26px) calc(env(safe-area-inset-left) + 18px);
        background-color: var(--paper);
        background-image: radial-gradient(circle at center, rgba(27, 23, 20, 0.075) 1px, transparent 1.1px);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: var(--kai);
        font-size: 16.5px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1.5px solid var(--ink);
        border-radius: 6px;
        box-shadow: 5px 5px 0 var(--ink);
        padding: 32px 26px 26px;
        position: relative;
      }

      .card::before {
        content: '';
        position: absolute;
        top: -11px;
        left: 24px;
        width: 88px;
        height: 22px;
        background: rgba(245, 219, 92, 0.72);
        border-left: 1px dashed rgba(27, 23, 20, 0.22);
        border-right: 1px dashed rgba(27, 23, 20, 0.22);
        transform: rotate(-2.4deg);
        mix-blend-mode: multiply;
      }

      .label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      h1 { margin: 12px 0 0; font-size: 27px; line-height: 1.22; }

      p { margin: 13px 0 0; color: var(--ink-2); }

      .who {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--vermilion);
        word-break: break-all;
        margin-top: 6px;
      }

      /* 触屏上按钮要够大够好按 */
      button {
        font-family: var(--kai);
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        width: 100%;
        min-height: 50px;
        padding: 15px 20px;
        margin-top: 12px;
        border: 1.5px solid var(--ink);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 3px 3px 0 var(--rule);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }

      button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--rule); }
      button:disabled { opacity: 0.42; }
      button.primary { background: var(--vermilion); color: #fff8f2; }

      .msg { margin-top: 12px; font-size: 14px; min-height: 1.4em; color: var(--vermilion); }
      .msg[data-kind='ok'] { color: var(--moss); }

      .hint {
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1.5px dashed var(--rule-2);
        font-size: 13px;
        color: var(--ink-3);
      }

      code {
        font-family: var(--mono);
        font-size: 12.5px;
        background: var(--paper-2);
        padding: 1px 5px;
        border-radius: 3px;
        word-break: break-all;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <span class="label">连接失败</span>
      <h1 id="title">连不上服务器</h1>
      <p id="lede">亿點點的内容都在服务器上 —— 路线、评论、你的规划记录。先把它接上。</p>
      <div class="who" id="url"></div>

      <button class="primary" id="retry">再试一次</button>
      <div class="msg" id="msg"></div>

      <div class="hint">
        服务器地址写在 <code>capacitor.config.json</code> 的 <code>server.url</code> 里，
        改完要 <code>npx cap sync</code> 再重新打包。
        想连本机调试（模拟器里宿主机是 <code>10.0.2.2</code>），把地址换成
        <code>http://10.0.2.2:3000/hall</code>，并把 <code>cleartext</code> 打开。
      </div>
    </div>

    <script>
      // 和 capacitor.config.json 的 server.url 保持一致（errorPath 页面拿不到配置，只能写一份）
      var APP_URL = 'https://yidiandian.drb1n.top/hall';

      var $ = function (id) { return document.getElementById(id); };
      var hits = 0;

      $('url').textContent = APP_URL;

      function say(text, kind) {
        var el = $('msg');
        el.textContent = text;
        el.dataset.kind = kind || '';
      }

      function go() {
        var btn = $('retry');
        btn.disabled = true;
        btn.textContent = '连接中…';
        say(navigator.onLine === false ? '这台设备看起来没联网。' : '正在重试…');
        // 直接跳回远程地址：能打开就说明恢复了，打不开会被 WebView 再打回这一页
        location.href = APP_URL;
      }

      $('retry').onclick = go;

      // 断网时按钮先别急着点，等网络事件回来自己重试一次
      window.addEventListener('online', function () {
        hits += 1;
        say('网络回来了，正在重连…', 'ok');
        if (hits <= 2) setTimeout(go, 600);
      });

      if (navigator.onLine === false) {
        say('这台设备看起来没联网。');
      }

      if (location.hash === '#settings') {
        $('title').textContent = '换个地址试试';
        $('lede').textContent = '动手改 capacitor.config.json 里的 server.url，重新打包即可。';
      }
    </script>
  </body>
</html>
